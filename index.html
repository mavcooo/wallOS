<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="wallOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <script>
      // Applica la Performance Mode prima del primo paint: nessun frame con
      // blur/ombre sui pannelli lenti. Lo store Zustand rilegge lo stesso JSON.
      try {
        var raw = localStorage.getItem('domus-kiosk-store');
        var state = raw ? JSON.parse(raw).state : null;
        if (state && state.ui && state.ui.performanceMode === true) {
          document.documentElement.dataset.performanceMode = 'true';
        }
      } catch (error) {
        // Storage non disponibile: si parte in modalità normale.
      }
    </script>
    <title>Domus · Controllo Domotico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
