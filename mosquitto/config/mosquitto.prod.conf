# ─────────────────────────────────────────────────────────────────────────────
# wallOS · broker MQTT — PRODUZIONE
#
# Autenticazione obbligatoria su ENTRAMBI i listener (TCP 1883 e WebSocket
# 9001). Le utenze e i permessi per topic vivono in:
#
#   /mosquitto/config/auth/passwd   → hash PBKDF2 (tools/init-mqtt-auth.sh)
#   /mosquitto/config/acl           → ACL least-privilege per utenza
#
# `allow_anonymous true` NON è ammesso: `mosquitto/entrypoint.sh` interrompe
# l'avvio se lo trova o se i file di auth mancano. L'esposizione verso la LAN
# è controllata da MOSQUITTO_BIND_IP nel docker-compose (default 127.0.0.1).
# ─────────────────────────────────────────────────────────────────────────────

persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout
connection_messages true

# Policy unica per tutti i listener: nessun listener può scivolare su anonymous.
allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/acl

# Un client senza clientId non deve poter occupare una sessione.
allow_zero_length_clientid false

# ── Listener TCP: backend Node, dispositivi IoT, simulatori ─────────────────
listener 1883 0.0.0.0

# ── Listener WebSocket: pannelli kiosk (MQTT_PROTOCOL=ws, path /mqtt) ───────
listener 9001 0.0.0.0
protocol websockets

# ── TLS/WSS (opzionale, obbligatorio fuori dalla LAN fidata) ────────────────
# Monta i certificati in /mosquitto/certs (vedi docker-compose.yml) e abilita
# il listener; poi ricostruisci il pannello con MQTT_PROTOCOL=wss,
# MQTT_PORT=9002. Il 9001 in chiaro può restare solo sulla LAN interna.
#
# listener 9002 0.0.0.0
# protocol websockets
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
# require_certificate false
