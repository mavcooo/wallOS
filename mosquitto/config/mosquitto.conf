# ─────────────────────────────────────────────────────────────────────────────
# wallOS · broker MQTT — SVILUPPO / SIMULAZIONE LOCALE
#
# Accesso anonimo consentito: questo file NON va usato in produzione né su una
# LAN condivisa con ospiti o dispositivi non fidati. Il container di produzione
# usa `mosquitto.prod.conf` (auth obbligatoria, password_file + ACL); il
# servizio compose `mqtt-dev` monta questo file e pubblica solo su 127.0.0.1.
#
# Avvio:  docker compose --profile dev up mqtt-dev
# ─────────────────────────────────────────────────────────────────────────────

persistence false
log_dest stdout

# TCP: dispositivi simulati e backend.
listener 1883
allow_anonymous true

# WebSocket: pannello nel browser (MQTT_PORT=9001, path /mqtt).
listener 9001
protocol websockets
allow_anonymous true
