# Configurazione di sviluppo / LAN fidata.
# Prima di esporre il broker fuori dalla LAN: abilitare password_file e ACL
# per topic (il pannello deve poter scrivere solo sui propri comandi).

persistence false

listener 1883
allow_anonymous true

# WebSocket: è la porta che usa il browser del pannello (MQTT_PORT=9001).
listener 9001
protocol websockets
allow_anonymous true
